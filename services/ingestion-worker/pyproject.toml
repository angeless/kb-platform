[project]
name = "ingestion-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "pymupdf>=1.24",
    "Pillow>=10.0",
    "python-docx>=1.1.0",
    "shared-config",
    "shared-models",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
