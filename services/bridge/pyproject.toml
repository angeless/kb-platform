[project]
name = "kb-bridge"
version = "0.1.0"
description = "KBSQL ↔ Hogwarts-KB bidirectional bridge service (v0.53+)"
requires-python = ">=3.12"
dependencies = [
    # Core
    "celery[redis]>=5.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "GitPython>=3.1",

    # File watching
    "watchfiles>=0.21",

    # Markdown handling
    "python-frontmatter>=1.0",
    "markdown-it-py>=3.0",

    # Multi-format conversion (lazy-imported in adapters/)
    # markitdown, docling, trafilatura are heavy — defined in optional groups

    # Local NLP (lazy-imported in summarize/classify)
    # sumy, keybert, spacy, yake — defined in optional groups

    # Internal packages
    "shared-config",
    "shared-errors",
    "shared-models",
    "shared-schemas",
]

[project.optional-dependencies]
office = [
    "markitdown[all]>=0.0.1a1",
]
docs = [
    "docling>=2.0",
]
web = [
    "trafilatura>=1.10",
    "playwright>=1.40",
    "readability-lxml>=0.8",
]
av = [
    "yt-dlp>=2024.1.1",
    "faster-whisper>=1.0",
    "scenedetect>=0.6",
]
nlp = [
    "sumy>=0.11",
    "keybert>=0.8",
    "spacy>=3.7",
    "yake>=0.4.8",
]
all = [
    "kb-bridge[office,docs,web,nlp]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
