[project]
name = "kb-mcp-server"
version = "0.1.0"
description = "MCP server exposing KBSQL bridge tools to Claude Code/Desktop and other MCP clients"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "kb-bridge",       # depends on the bridge service
    "bridge-utils",    # depends on summarize/classify
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
