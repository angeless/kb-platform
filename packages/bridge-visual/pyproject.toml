[project]
name = "bridge-visual"
version = "0.1.0"
description = "Reader-aware visual augmentation (mermaid + outline) for KBSQL bridge"
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bridge_visual*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
