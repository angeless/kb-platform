name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kb_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e packages/shared-config
          pip install -e packages/shared-errors
          pip install -e packages/shared-models
          pip install -e packages/shared-schemas
          pip install -e "services/api[dev]"
          pip install -e services/ingestion-worker
          pip install -e services/pipeline-worker
          pip install -e services/ai-orchestrator

      - name: Run API tests (non-DB)
        run: |
          python -m pytest services/api/tests/test_utils.py \
                           services/api/tests/test_search_utils.py \
                           services/api/tests/test_diff_utils.py \
                           -v --tb=short

      - name: Run API tests (DB)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kb_platform
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: |
          python -m pytest services/api/tests/ -v --tb=short \
            --ignore=services/api/tests/test_tenant_isolation.py \
            --ignore=services/api/tests/test_e2e.py

      - name: Run Ingestion Worker tests
        run: |
          python -m pytest services/ingestion-worker/tests/ -v --tb=short

      - name: Run Pipeline Worker tests
        run: |
          python -m pytest services/pipeline-worker/tests/ -v --tb=short

      - name: Run AI Orchestrator tests
        run: |
          python -m pytest services/ai-orchestrator/tests/ -v --tb=short

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run --reporter=verbose

      - name: Type check
        run: npx tsc --noEmit
